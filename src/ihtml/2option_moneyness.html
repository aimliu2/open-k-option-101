<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Options Moneyness</title>
<link rel="stylesheet" href="../theme/ivory.min.css">
<style>
  :root { --grid: var(--rule); --itm: var(--accent); }

  body {
    margin: 0; padding: 4px 8px; background: var(--bg); overflow: hidden; color: var(--fg);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px;
            color: var(--body); margin-bottom: 4px; }
  .legend .name { margin-left: auto; font-family: var(--mono); font-size: 12px;
                  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 22px; height: 0; border-top: 2px solid; }
  .block { width: 22px; height: 12px; border-radius: 3px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
  .chart .note { font-family: var(--sans); font-size: 13px; fill: var(--body); }
  .chart .lane { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; fill: var(--fg); }
  .tip { position: absolute; pointer-events: none; background: var(--bg);
         border: 1px solid var(--gray-300); border-radius: 8px; padding: 10px 12px;
         font-size: 13px; line-height: 1.5; color: var(--body); white-space: nowrap;
         box-shadow: 0 4px 16px rgba(20,20,19,.08); }
  .tip b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip .t { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
            text-transform: uppercase; color: var(--muted); }

</style>
</head>
<body>
<div class="legend">
  <span><i class="block" style="background:var(--itm);opacity:.22"></i>ITM</span>
  <span><i class="block" style="background:var(--rule)"></i>OTM</span>
  <span><i class="swatch" style="border-color:var(--gray-500)"></i>Spot = ATM</span>
  <span><i class="dot"></i>Example strike</span>
  <span class="name" id="name"></span>
</div>
<div class="chart" id="chart"><div class="tip" id="tip" hidden></div></div>

<script>
/* ---- CONFIG ---- */
const SPOT = 100000;
const LANES = [ // ITM side relative to spot; example strike
  { key: "call", label: "CALL", itmBelow: true,  strike: 103000 },
  { key: "put",  label: "PUT",  itmBelow: false, strike: 97000 }
];
const x0 = 90000, x1 = 110000, SNAP = 1000;
/* ---------------- */

const usd = v => "$" + v.toLocaleString("en-US");
const k = v => (v / 1000) + "k";
const status = (lane, K) => K === SPOT ? "ATM" : (K < SPOT) === lane.itmBelow ? "ITM" : "OTM";
const intrinsic = (lane, K) => Math.max(lane.key === "call" ? SPOT - K : K - SPOT, 0);

document.getElementById("name").textContent = `Moneyness · BTC spot ${usd(SPOT)}`;

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const a in attrs) n.setAttribute(a, attrs[a]);
  if (parent) parent.appendChild(n);
  return n;
};

const box = document.getElementById("chart"), tip = document.getElementById("tip");
let svg;

function draw() {
  const W = Math.max(320, box.clientWidth), H = Math.max(240, innerHeight - box.offsetTop - 8);
  const m = { l: 56, r: 16, t: 28, b: 44 };
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const plotH = H - m.t - m.b, laneH = Math.min(56, plotH / 4);
  const laneY = i => m.t + plotH * (i === 0 ? 0.3 : 0.75) - laneH / 2;

  if (svg) svg.remove();
  svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `Call and put moneyness versus strike price, BTC spot ${usd(SPOT)}` });
  box.insertBefore(svg, tip);

  // x axis: strike price
  for (let v = x0; v <= x1; v += 5000) {
    el("line", { x1: X(v), x2: X(v), y1: m.t, y2: H - m.b, stroke: "var(--grid)" }, svg);
    el("text", { x: X(v), y: H - m.b + 22, "text-anchor": "middle" }, svg).textContent = "$" + k(v);
  }
  el("text", { x: W - m.r, y: H - 4, "text-anchor": "end" }, svg).textContent = "Strike price →";

  // lanes: ITM half tinted, OTM half neutral; zone names inside
  LANES.forEach((lane, i) => {
    const y = laneY(i), cy = y + laneH / 2;
    el("rect", { x: X(x0), y, width: X(x1) - X(x0), height: laneH, rx: 6, fill: "var(--rule)" }, svg);
    const [a, b] = lane.itmBelow ? [x0, SPOT] : [SPOT, x1];
    el("rect", { x: X(a), y, width: X(b) - X(a), height: laneH, rx: 6,
      fill: "var(--itm)", "fill-opacity": .22 }, svg);
    el("text", { class: "lane", x: m.l - 12, y: cy + 4, "text-anchor": "end" }, svg).textContent = lane.label;
    // zone names sit at the outer ends, away from strikes near spot
    el("text", { class: "note", x: X(x0) + 12, y: cy + 4, "text-anchor": "start" }, svg)
      .textContent = lane.itmBelow ? "ITM · K < spot" : "OTM · K < spot";
    el("text", { class: "note", x: X(x1) - 12, y: cy + 4, "text-anchor": "end" }, svg)
      .textContent = lane.itmBelow ? "OTM · K > spot" : "ITM · K > spot";
  });

  // spot line = ATM
  el("line", { x1: X(SPOT), x2: X(SPOT), y1: m.t, y2: H - m.b, stroke: "var(--gray-500)", "stroke-width": 2 }, svg);
  el("text", { x: X(SPOT), y: m.t - 10, "text-anchor": "middle" }, svg).textContent = `SPOT ${usd(SPOT)} = ATM`;

  // example strikes (drawn after the spot line so they sit on top)
  LANES.forEach((lane, i) => {
    const y = laneY(i), K = lane.strike;
    el("circle", { cx: X(K), cy: y + laneH / 2, r: 6, fill: "var(--accent)", stroke: "var(--bg)", "stroke-width": 2 }, svg);
    el("text", { class: "note", x: X(K), y: y + laneH + 18, "text-anchor": "middle" }, svg)
      .textContent = `K ${usd(K)} · ${status(lane, K)}`;
  });

  // hover layer: treat the cursor as a hypothetical strike
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--gray-500)", "stroke-width": 1,
    "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" }, svg);

  const show = e => {
    const r = svg.getBoundingClientRect(), sx = W / r.width;
    const px = (e.clientX - r.left) * sx;
    const raw = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    const K = Math.min(x1, Math.max(x0, Math.round(raw / SNAP) * SNAP));
    const cx = X(K);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="t">Strike ${usd(K)}</div>` + LANES.map(l =>
      `${l.label[0] + l.label.slice(1).toLowerCase()} <b>${status(l, K)}</b> · intrinsic <b>${usd(intrinsic(l, K))}</b>`
    ).join("<br>");
    tip.hidden = false;
    const left = cx / sx, flip = left > r.width - 230;
    tip.style.left = (flip ? left - tip.offsetWidth - 14 : left + 14) + "px";
    tip.style.top = (m.t / sx) + "px";
  };
  const hide = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}

let lastW = 0;
new ResizeObserver(() => { if (box.clientWidth + innerHeight !== lastW) { lastW = box.clientWidth + innerHeight; draw(); } }).observe(document.body);
</script>
</body>
</html>
