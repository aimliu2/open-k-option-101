<style>
  /* ------------------------------------------------------------------
     Scroll-snap shell — each Marp slide fills one viewport
     ------------------------------------------------------------------ */
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #141413;
    scroll-snap-type: y mandatory;
    overflow-x: hidden;
  }
  div.marpit > svg[data-marpit-svg] {
    display: block;
    width: 100vw;
    height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

<script type="text/plain" id="srcdoc-css-1">
:root { color-scheme: light; font-family: system-ui, sans-serif; color: #262722; background: #f8f6ef; }
* { box-sizing: border-box; }
body { margin: 0; padding: 8px; }
main { max-width: 1440px; height: calc(100dvh - 16px); min-height: 480px; margin: auto; display: grid; grid-template-rows: 42px 24px minmax(240px, 1fr) auto 76px; gap: 6px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; }
h1 { font-size: 18px; margin: 0 0 2px; font-weight: 650; letter-spacing: -.02em; }
p { margin: 0; }
#date-range, .chart-mode { color: #726d63; font-size: 11px; }
.chart-mode { text-align: right; }
#readout { font: 11px/24px ui-monospace, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chart { width: 100%; min-width: 0; min-height: 0; overflow-x: auto; border-radius: 4px; }
#chart:focus-visible { outline: 2px solid #16766a; outline-offset: -2px; }
#chart-layout { position: relative; height: 100%; }
#strike-controls { position: absolute; top: 0; width: 116px; height: 100%; font-size: 11px; color: #726d63; }
#strike-controls label { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
#strike-value { display: block; margin-top: 3px; font-size: 17px; line-height: 20px; font-weight: 650; color: #262722; font-variant-numeric: tabular-nums; }
#contract-moneyness { display: block; margin-top: 2px; font-weight: 600; color: #4e635e; }
#strike-slider { position: absolute; left: 4px; width: 28px; margin: 0; padding: 0; border: 0; writing-mode: vertical-lr; direction: rtl; appearance: none; background: transparent; cursor: ns-resize; touch-action: none; }
#strike-slider::-webkit-slider-runnable-track { width: 6px; height: 100%; background: #d8d4c9; border-radius: 4px; }
#strike-slider::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: #16766a; border: 2px solid #f8f6ef; border-radius: 50%; box-shadow: 0 0 0 1px #16766a; }
#strike-slider::-moz-range-track { width: 6px; background: #d8d4c9; border-radius: 4px; }
#strike-slider::-moz-range-thumb { width: 14px; height: 14px; background: #16766a; border: 2px solid #f8f6ef; border-radius: 50%; }
#strike-slider:focus-visible { outline: 2px solid #16766a; outline-offset: 3px; border-radius: 8px; }
.strike-bound { position: absolute; left: 36px; font: 11px ui-monospace, monospace; white-space: nowrap; }
#strike-help { position: absolute; bottom: 4px; left: 0; right: 0; line-height: 16px; }
#reset-strike { margin-top: 4px; padding: 4px 8px; font: inherit; color: #4e635e; background: #fffdf7; border: 1px solid #ccc7bb; border-radius: 5px; cursor: pointer; }
svg { display: block; }
svg text { fill: #726d63; font: 11px ui-monospace, monospace; }
svg .panel-title { fill: #262722; font-weight: 600; }
svg .profit-text { fill: #16766a; }
svg .loss-text { fill: #b34d40; }
#option-summary { color: #726d63; font-size: 11px; line-height: 16px; }
#option-readout { padding: 10px 12px; text-align: center; background: #eeece5; border: 1px solid #d8d4c9; border-radius: 8px; font-variant-numeric: tabular-nums; }
#option-readout h2 { margin: 0 0 4px; font-size: clamp(22px, 2.8vw, 30px); line-height: 1.15; letter-spacing: -.025em; }
#option-details { color: #726d63; font-size: 12px; line-height: 18px; }
#option-readout[data-state="profit"] { background: #e8f1eb; border-color: #9fc2b1; }
#option-readout[data-state="profit"] h2 { color: #16766a; }
#option-readout[data-state="loss"] { background: #f6eae5; border-color: #d8aea2; }
#option-readout[data-state="loss"] h2 { color: #b34d40; }
.moneyness-shade, .moneyness-annotation { transition: opacity 160ms ease; }
svg .moneyness-annotation { fill: #42443f; font-size: 17px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .moneyness-shade, .moneyness-annotation { transition: none; } }
@media (max-width: 600px) {
  main { grid-template-rows: 42px 24px minmax(240px, 1fr) auto 90px; }
  #option-summary { font-size: 10px; line-height: 14px; }
  #option-readout { padding: 8px; }
  #option-details { font-size: 11px; line-height: 16px; }
}

</script>
<script type="text/plain" id="srcdoc-css-2">
/* Whole presentation, including controls and readouts, stays inside a slide frame. */
body { padding: 0; }
main.spread-page {
  width: min(100%, 1024px); max-width: 1024px; height: min(100dvh, 576px);
  min-height: 520px; margin: 0 auto; padding: 8px;
  grid-template-rows: 42px 22px 24px minmax(240px, 1fr) 46px 80px; gap: 6px;
  --buy: #366b94; --sell: #a06b27; --net: #262722;
}
.spread-page header { position: relative; }
.spread-page h1 { font-size: 18px; }
.spread-page .header-actions { display: flex; align-items: center; gap: 10px; }
.spread-page .chart-mode { white-space: nowrap; }
.spread-page #date-range { font-size: 10px; }
.spread-page .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11px; }
.spread-page .legend { display: flex; gap: 14px; align-items: center; }
.spread-page .legend span { display: inline-flex; align-items: center; gap: 5px; }
.spread-page .key { width: 18px; border-top: 3px solid var(--net); }
.spread-page .key.buy { border-top: 2px dashed var(--buy); }
.spread-page .key.sell { border-top: 2px dashed var(--sell); }
.spread-page .leg-key { opacity: .45; }
.spread-page:has(#show-legs:checked) .leg-key { opacity: 1; }
.spread-page .toolbar-actions { display: flex; align-items: center; gap: 14px; }
.spread-page .toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
.spread-page input[type=checkbox] { accent-color: #16766a; margin: 0; }
.spread-page button { font: inherit; color: #4e635e; background: #fffdf7; border: 1px solid #ccc7bb; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
.spread-page button:focus-visible { outline: 2px solid #16766a; outline-offset: 2px; }
.spread-page #strike-controls { width: 166px; }
.spread-page .strike-lane { position: absolute; top: 0; bottom: 0; width: 80px; text-align: center; }
.spread-page .strike-lane.buy { left: 0; --leg-color: var(--buy); }
.spread-page .strike-lane.sell { left: 84px; --leg-color: var(--sell); }
.spread-page .strike-lane label { display: block; font-size: 11px; color: var(--leg-color); font-weight: 650; }
.spread-page .strike-lane output { display: block; margin-top: 3px; color: #262722; font-size: 16px; line-height: 20px; font-weight: 650; }
.spread-page .leg-premium { display: block; font-size: 10px; margin-top: 2px; }
.spread-page .strike-slider { position: absolute; left: 26px; width: 28px; margin: 0; padding: 0; border: 0; writing-mode: vertical-lr; direction: rtl; appearance: none; background: transparent; cursor: ns-resize; touch-action: none; }
.spread-page .strike-slider::-webkit-slider-runnable-track { width: 6px; height: 100%; background: #d8d4c9; border-radius: 4px; }
.spread-page .strike-slider::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: var(--leg-color); border: 2px solid #f8f6ef; border-radius: 50%; box-shadow: 0 0 0 1px var(--leg-color); }
.spread-page .strike-slider::-moz-range-track { width: 6px; background: #d8d4c9; border-radius: 4px; }
.spread-page .strike-slider::-moz-range-thumb { width: 14px; height: 14px; background: var(--leg-color); border: 2px solid #f8f6ef; border-radius: 50%; }
.spread-page .strike-slider:focus-visible { outline: 2px solid var(--leg-color); outline-offset: 3px; border-radius: 8px; }
.spread-page #strike-help { font-size: 10px; line-height: 14px; bottom: 0; text-align: center; }
.spread-page #constraint-message { display: block; min-height: 14px; font-weight: 600; color: #8b5720; }
.spread-page #option-summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.spread-page .metric { padding: 5px 8px; background: #eeece5; border-radius: 5px; }
.spread-page .metric span { display: block; font-size: 10px; line-height: 13px; }
.spread-page .metric strong { display: block; color: #262722; font-size: 15px; line-height: 19px; font-weight: 600; }
.spread-page #option-readout { padding: 6px 8px; }
.spread-page #option-readout h2 { margin: 0 0 2px; font-size: 25px; line-height: 28px; }
.spread-page #option-details, .spread-page #leg-equation { font-size: 11px; line-height: 16px; }
.spread-page .buy-text { color: var(--buy); }

@media (max-width: 760px) {

  .spread-page .toolbar-actions { gap: 6px; }

}

before expiry.&lt;/span&gt;&#10;    &lt;/span&gt;&#10;  &lt;/div&gt;&#10;  &lt;p class=&quot;lede&quot;&gt;30-day expiration P&amp;amp;L · per 1 BTC · illustrative quotes, before fees&lt;/p&gt;&#10;&lt;/div&gt;&#10;&#10;&lt;div class=&quot;grid&quot;&gt;&#10;  &lt;div class=&quot;panel&quot;&gt;&#10;    &lt;div&gt;&#10;      &lt;div class=&quot;title-row&quot;&gt;&lt;h2&gt;Bullish: Call comparison&lt;/h2&gt;&lt;span class=&quot;info&quot;&gt;&#10;      &lt;button type=&quot;button&quot; aria-label=&quot;Bullish: Call comparison details&quot; aria-describedby=&quot;bull-info&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; fill=&quot;none&quot; viewBox=&quot;0 0 24 24&quot; stroke-width=&quot;1.5&quot; stroke=&quot;currentColor&quot; aria-hidden=&quot;true&quot;&gt;&#10;  &lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z&quot; /&gt;&#10;&lt;/svg&gt;&lt;/button&gt;&#10;      &lt;span class=&quot;tip&quot; id=&quot;bull-info&quot; role=&quot;tooltip&quot;&gt;Long ATM call: buy $100k strike for $4,000. Bull call spread: buy $100k call for $4,000, sell $103k call for $2,300. Net debit: $1,700. The long call has theoretically unlimited upside; the spread caps profit at $1,300.&lt;/span&gt;&#10;    &lt;/span&gt;&lt;/div&gt;&#10;      &lt;p class=&quot;setup&quot;&gt;Buy $100k / sell $103k · &lt;strong&gt;Net debit $1,700&lt;/strong&gt;&lt;/p&gt;&#10;    &lt;/div&gt;&#10;    &lt;div class=&quot;legend&quot;&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--single)&quot;&gt;&lt;/i&gt;Long call&lt;/span&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--spread)&quot;&gt;&lt;/i&gt;Bull call debit spread&lt;/span&gt;&#10;    &lt;/div&gt;&#10;    &lt;svg class=&quot;payoff&quot; id=&quot;bull&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label= t; aria-hidden=&quot;true&quot;&gt;&#10;  &lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z&quot; /&gt;&#10;&lt;/svg&gt;&lt;/button&gt;&#10;      &lt;span class=&quot;tip&quot; id=&quot;bear-info&quot; role=&quot;tooltip&quot;&gt;Long ATM put: buy $100k strike for $4,000. Bear put spread: buy $100k put for $4,000, sell $97k put for $1,600. Net debit: $2,400. A long put’s maximum profit is limited because BTC cannot fall below zero. This illustrative bear spread is relatively expensive: maximum profit is only $600 before fees.&lt;/span&gt;&#10;    &lt;/span&gt;&lt;/div&gt;&#10;      &lt;p class=&quot;setup&quot;&gt;Buy $100k / sell $97k · &lt;strong&gt;Net debit $2,400&lt;/strong&gt;&lt;/p&gt;&#10;    &lt;/div&gt;&#10;    &lt;div class=&quot;legend&quot;&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--single)&quot;&gt;&lt;/i&gt;Long put&lt;/span&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--spread)&quot;&gt;&lt;/i&gt;Bear put debit spread&lt;/span&gt;&#10;    &lt;/div&gt;&#10;    &lt;svg class=&quot;payoff&quot; id=&quot;bear&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Expiration P&amp;L of a long put versus a bear put debit spread&quot;&gt;&lt;/svg&gt;&#10;    &lt;label for=&quot;bearslider&quot;&gt;BTC expiration price &lt;output id=&quot;bearprice&quot;&gt;&lt;/output&gt;&lt;/label&gt;&#10;    &lt;input id=&quot;bearslider&quot; type=&quot;range&quot; min=&quot;80000&quot; max=&quot;120000&quot; step=&quot;500&quot; value=&quot;97000&quot;&gt;&#10;    &lt;div class=&quot;stats&quot;&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Long put P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;bearsingle&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Debit spread P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;bearspread&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;    &lt;/div&gt;&#10;    &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&#10;      &lt;tr&gt;&lt;th&gt;Metric&lt;/th&gt;&lt;th&gt;Long put&lt;/th&gt;&lt;th&gt;Debit spread&lt;/th&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Initial debit&lt;/td&gt;&lt;td&gt;$4,000&lt;/td&gt;&lt;td&gt;$2,400&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Breakeven&lt;/td&gt;&lt;td&gt;$96,000&lt;/td&gt;&lt;td&gt;$97,600&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Maximum loss&lt;/td&gt;&lt;td&gt;$4,000&lt;/td&gt;&lt;td&gt;$2,400&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Maximum profit&lt;/td&gt;&lt;td&gt;$96,000&lt;/td&gt;&lt;td&gt;$600&lt;/td&gt;&lt;/tr&gt;&#10;    &lt;/table&gt;&lt;/div&gt;&#10;  &lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;&lt;script&gt;&#10;// Explanations also open on keyboard focus or a tap; Escape dismisses them.&#10;for (const info of document.querySelectorAll('.info')) {&#10;  info.addEventListener('keydown', event =&gt; {&#10;    if (event.key === 'Escape') {&#10;      info.classList.add('dismissed');&#10;    }&#10;  });&#10;  for (const event of ['pointerenter', 'focusin', 'click'])&#10;    info.addEventListener(event, () =&gt; info.classList.remove('dismissed'));&#10;}&#10;&#10;const money = n =&gt; (n &lt; 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 });&#10;const configs = {&#10;  bull: { single: s =&gt; Math.max(s - 100000, 0) - 4000,&#10;          spread: s =&gt; Math.max(s - 100000, 0) - Math.max(s - 103000, 0) - 1700 },&#10;  bear: { single: s =&gt; Math.max(100000 - s, 0) - 4000,&#10;          spread: s =&gt; Math.max(100000 - s, 0) - Math.max(97000 - s, 0) - 2400 },&#10;};&#10;&#10;const NS = 'http://www.w3.org/2000/svg';&#10;const $ = id =&gt; document.getElementById(id);&#10;function el(tag, attrs, parent) {&#10;  const n = document.createElementNS(NS, tag);&#10;  for (const k in attrs) n.setAttribute(k, attrs[k]);&#10;  parent.appendChild(n);&#10;  return n;&#10;}&#10;&#10;const minX = 80000, maxX = 120000, minY = -5000, maxY = 17000;&#10;&#10;function render(k) {&#10;  const svg = $(k), cfg = configs[k], price = +$(k + 'slider').value;&#10;  // Match the drawing coordinates to the available space so axis text stays readable.&#10;  const W = svg.clientWidth, H = svg.clientHeight, L = 38, R = 16, T = 10, B = 24;&#10;  const X = s =&gt; L + (s - minX) / (maxX - minX) * (W - L - R);&#10;  const Y = v =&gt; T + (maxY - v) / (maxY - minY) * (H - T - B);&#10;  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);&#10;  svg.replaceChildren();&#10;&#10;  for (let v = -5000; v &lt;= 15000; v += 5000) {&#10;    el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: v === 0 ? 'var(--gray-500)' : 'var(--rule)',&#10;                 'stroke-dasharray': v === 0 ? '5 4' : 'none' }, svg);&#10;    el('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }, svg).textContent = v / 1000 + 'k';&#10;  }&#10;  for (let s = minX; s &lt;= maxX; s += 10000)&#10;    el('text', { x: X(s), y: H - 8, 'text-anchor': 'middle' }, svg).textContent = s / 1000 + 'k';&#10;&#10;  const lines = [[cfg.single, 'var(--single)'], [cfg.spread, 'var(--spread)']];&#10;  for (const [fn, color] of lines) {&#10;    let d = '';&#10;    for (let s = minX; s &lt;= maxX; s += 100) d += (s === minX ? 'M' : 'L') + X(s).toFixed(1) + ',' + Y(fn(s)).toFixed(1);&#10;    el('path', { d, fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, svg);&#10;  }&#10;&#10;  el('line', { x1: X(price), x2: X(price), y1: T, y2: H - B, stroke: 'var(--gray-500)', 'stroke-dasharray': '4 4' }, svg);&#10;  for (const [fn, color] of lines) el('circle', { cx: X(price), cy: Y(fn(price)), r: 4, fill: color }, svg);&#10;&#10;  $(k + 'price').textContent = money(price);&#10;  for (const [id, v] of [['single', cfg.single(price)], ['spread', cfg.spread(price)]]) {&#10;    const out = $(k + id);&#10;    out.textContent = money <h2 id="advantage-over-long-callput">Advantage over long call/put</h2>
<p>The Bull Call Debit Spread has three main advantages over a regular long call:</p>
<ol>
<li>Lower upfront premium — you spend less to enter the position.</li>
<li>Lower maximum loss — if BTC crashes or stays flat, you lose less money.</li>
<li>Lower breakeven price — BTC doesn't need to rise as much for you to make a profit.</li>
<li>Theta and Gamma shape changed</li>
</ol>

<script>
  (function () {
    const slides = Array.from(document.querySelectorAll('div.marpit > svg[data-marpit-svg]'));
    let current = 0;

    // Letterbox each slide in its own background colour
    slides.forEach(function (s) {
      const sec = s.querySelector('section');
      if (sec) s.style.background = getComputedStyle(sec).backgroundColor;
    });

    function go(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides[current].scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')                    { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') { e.preventDefault(); go(0); }
      if (e.key === 'End')  { e.preventDefault(); go(slides.length - 1); }
    });

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) current = slides.indexOf(en.target);
      });
    }, { threshold: 0.6 });

    slides.forEach(function (s) { obs.observe(s); });
  })();
</script>
