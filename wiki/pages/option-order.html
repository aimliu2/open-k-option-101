<table>
<thead>
<tr>
<th>Order type</th>
<th>Behavior</th>
<th>Typical use</th>
</tr>
</thead>
<tbody>
<tr>
<td>GTC (Good Till Cancelled)</td>
<td>Remains open until filled, cancelled, or removed under exchange rules</td>
<td>Waiting for your desired premium</td>
</tr>
<tr>
<td>IOC (Immediate or Cancel)</td>
<td>Fills immediately as much as possible; cancels the rest</td>
<td>Quick execution without leaving an order</td>
</tr>
<tr>
<td>FOK (Fill or Kill)</td>
<td>Must fill the entire quantity immediately or cancel</td>
<td>Avoiding partial fills</td>
</tr>
<tr>
<td>GTD / Day</td>
<td>Expires at a specified time or end of day</td>
<td>Time-limited quotes, where supported</td>
</tr>
</tbody>
</table>

  (function () {

      current = Math.max(0, Math.min(slides.length - 1, i));
      slides[current].scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')                    { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') { e.preventDefault(); go(0); }
      if (e.key === 'End')  { e.preventDefault(); go(slides.length - 1); }
    });

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) current = slides.indexOf(en.target);
      });
    }, { threshold: 0.6 });

    slides.forEach(function (s) { obs.observe(s); });
  })();
</script>
</body>
</html>
