.textContent = short(v);&#10;  }&#10;  xTicks.forEach(([t, text], i) =&gt; svgEl('text', { x: x(t), y: H - 8,&#10;    'text-anchor': i === 0 ? 'start' : i === xTicks.length - 1 ? 'end' : 'middle' }, svg).textContent = text);&#10;  if (vline &amp;&amp; vline[0] &gt;= 0 &amp;&amp; vline[0] &lt;= 1) {&#10;    svgEl('line', { x1: x(vline[0]), x2: x(vline[0]), y1: m.t, y2: H - m.b, stroke: 'var(--gray-300)', 'stroke-dasharray': '4 4' }, svg);&#10;    svgEl('text', { x: x(vline[0]) + 4, y: m.t + 10 }, svg).textContent = vline[1];&#10;  }&#10;&#10;  const at = (key, t) =&gt; { // value on the sampled curve at t, for the &quot;today&quot; dot&#10;    const i = Math.round(t * (pts.length - 1));&#10;    return pts[Math.min(pts.length - 1, Math.max(0, i))][key];&#10;  };&#10;  for (const [key, color] of [['put', 'var(--accent)'], ['call', 'var(--olive)']]) {&#10;    svgEl('path', { d: pts.map((p, i) =&gt; (i ? 'L' : 'M') + x(p.t).toFixed(1) + ',' + y(p[key]).toFixed(1)).join(''),&#10;                    fill: 'none', stroke: color, 'stroke-width': 2 }, svg);&#10;    svgEl('circle', { cx: x(now), cy: y(at(key, now)), r: 3.5, fill: color }, svg);&#10;  }&#10;}&#10;&#10;function drawDecay(S, K, days, r, sigma) {&#10;  // x runs left→right from today's days remaining down to expiry, so time flows forward.&#10;  const n = 200, pts = [];&#10;  for (let i = 0; i &lt;= n; i++) pts.push({ t: i / n, ...price(S, K, days * (1 - i / n), r, sigma) });&#10;  const ticks = [0, 1, 2, 3, 4, 5].map(i =&gt; { const d = days * (1 - i / 5);&#10;    return [i / 5, i === 5 ? 'expiry' : +d.toFixed(d &lt; 10 ? 1 : 0) + 'd']; });&#10;  plot(el('chart'), 'Put and call premium as days to expiry run down to zero', pts, 0, ticks);&#10;}&#10;&#10;function drawSpot(S, K, days, r, sigma) {&#10;  // Spot range = ±3 one-day standard deviations (lognormal), i.e. a plausible move within a single day.&#10;  const k = 3 * sigma * Math.sqrt(1 / 365), lo = S * Math.exp(-k), hi = S * Math.exp(k);&#10;  const n = 200, p       const sec = s.querySelector('section');
      if (sec) s.style.background = getComputedStyle(sec).backgroundColor;
    });

    function go(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides[current].scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')                    { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') { e.preventDefault(); go(0); }
      if (e.key === 'End')  { e.preventDefault(); go(slides.length - 1); }
    });

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) current = slides.indexOf(en.target);
      });
    }, { threshold: 0.6 });

    slides.forEach(function (s) { obs.observe(s); });
  })();
</script>
</body>
</html>
