2px 0 0; accent-color: var(--accent); }&#10;  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }&#10;  .stat { padding: 8px 12px; background: var(--rule); border-radius: 8px; }&#10;  .stat small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }&#10;  .stat strong { font-family: var(--serif); font-weight: 500; font-size: clamp(18px, 2.4vw, 24px); font-variant-numeric: tabular-nums; }&#10;  .gain { color: var(--gain) !important; }&#10;  .loss { color: var(--loss) !important; }&#10;  .scroll { overflow-x: auto; margin-top: 10px; }&#10;  table { font-size: 13px; }&#10;  th { padding: 0 8px 6px 0; font-size: 11px; white-space: nowrap; }&#10;  td { padding: 6px 8px 6px 0; font-variant-numeric: tabular-nums; }&#10;  th:not(:first-child), td:not(:first-child) { text-align: right; }&#10;  .note { margin-top: 12px; font-size: 12px; line-height: 1.5; color: var(--muted); }&#10;&lt;/style&gt;&#10;&lt;/head&gt;&#10;&lt;body&gt;&#10;&lt;h1&gt;BTC Options: Long Option vs Debit Spread&lt;/h1&gt;&#10;&lt;p class=&quot;lede&quot;&gt;Illustrative 30-day expiration P&amp;amp;L, per 1 BTC option exposure. Quotes are taken from &lt;code&gt;btc_itm_atm_otm_long_options_payoff.csv&lt;/code&gt;. Buy at ask, sell at bid; excludes trading fees. These are expiration payoffs, not option values before expiry.&lt;/p&gt;&#10;&#10;&lt;div class=&quot;grid&quot;&gt;&#10;  &lt;div class=&quot;panel&quot;&gt;&#10;    &lt;h2&gt;Bullish: Call comparison&lt;/h2&gt;&#10;    &lt;p&gt;Long ATM call: buy $100k strike for $4,000.&lt;br&gt;Bull call spread: buy $100k call for $4,000, sell $103k call for $2,300. &lt;strong&gt;Net debit: $1,700.&lt;/strong&gt;&lt;/p&gt;&#10;    &lt;div class=&quot;legend&quot;&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--single)&quot;&gt;&lt;/i&gt;Long call&lt;/span&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--spread)&quot;&gt;&lt;/i&gt;Bull call debit spread&lt;/span&gt;&#10;    &lt;/div&gt;&#10;    &lt;svg id=&quot;bull&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Expiration P&amp;L of a long call versus a bull call debit spread&quot;&gt;&lt;/svg&gt;&#10;    &lt;label for=&quot;bullslider&quot;&gt;BTC expiration price &lt;output id=&quot;bullprice&quot;&gt;&lt;/output&gt;&lt;/label&gt;&#10;    &lt;input id=&quot;bullslider&quot; type=&quot;range&quot; min=&quot;80000&quot; max=&quot;120000&quot; step=&quot;500&quot; value=&quot;103000&quot;&gt;&#10;    &lt;div class=&quot;stats&quot;&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Long call P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;bullsingle&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Debit spread P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;bullspread&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;    &lt;/div&gt;&#10;    &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&#10;      &lt;tr&gt;&lt;th&gt;Metric&lt;/th&gt;&lt;th&gt;Long call&lt;/th&gt;&lt;th&gt;Debit spread&lt;/th&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Initial debit&lt;/td&gt;&lt;td&gt;$4,000&lt;/td&gt;&lt;td&gt;$1,700&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Breakeven&lt;/td&gt;&lt;td&gt;$104,000&lt;/td&gt;&lt;td&gt;$101,700&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Maximum loss&lt;/td&gt;&lt;td&gt;$4,000&lt;/td&gt;&lt;td&gt;$1,700&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Maximum profit&lt;/td&gt;&lt;td&gt;Unlimited*&lt;/td&gt;&lt;td&gt;$1,300&lt;/td&gt;&lt;/tr&gt;&#10;    &lt;/table&gt;&lt;/div&gt;&#10;  &lt;/div&gt;&#10;&#10;  &lt;div class=&quot;panel&quot;&gt;&#10;    &lt;h2&gt;Bearish: Put comparison&lt;/h2&gt;&#10;    &lt;p&gt;Long ATM put: buy $100k strike for $4,000.&lt;br&gt;Bear put spread: buy $100k put for $4,000, sell $97k put for $1,600. &lt;strong&gt;Net debit: $2,400.&lt;/strong&gt;&lt;/p&gt;&#10;    &lt;div class=&quot;legend&quot;&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--single)&quot;&gt;&lt;/i&gt;Long put&lt;/span&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--spread)&quot;&gt;&lt;/i&gt;Bear put debit spread&lt;/span&gt;&#10;    &lt;/div&gt;&#10;    &lt;svg id=&quot;bear&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Expiration P&amp;L of a long put versus a bear put debit spread&quot;&gt;&lt;/svg&gt;&#10;    &lt;label for=&quot;bearslider&quot;&gt;BTC expiration price &lt;output id=&quot;bearprice&quot;&gt;&lt;/output&gt;&lt;/label&gt;&#10;    &lt;input id=&quot;bearslider&quot; type=&quot;range&quot; min=&quot;80000&quot; max=&quot;120000&quot; step=&quot;500&quot; value=&quot;97000&quot;&gt;&#10;    &lt;div class=&quot;stats&quot;&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Long put P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;bearsingle&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Debit spread P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;bearspread&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;    &lt;/div&gt;&#10;    &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&#10;      &lt;tr&gt;&lt;th&gt;Metric&lt;/th&gt;&lt;th&gt;Long put&lt;/th&gt;&lt;th&gt;Debit spread&lt;/th&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Initial debit&lt;/td&gt;&lt;td&gt;$4,000&lt;/td&gt;&lt;td&gt;$2,400&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Breakeven&lt;/td&gt;&lt;td&gt;$96,000&lt;/td&gt;&lt;td&gt;$97,600&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Maximum loss&lt;/td&gt;&lt;td&gt;$4,000&lt;/td&gt;&lt;td&gt;$2,400&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Maximum profit&lt;/td&gt;&lt;td&gt;$96,000†&lt;/td&gt;&lt;td&gt;$600&lt;/td&gt;&lt;/tr&gt;&#10;    &lt;/table&gt;&lt;/div&gt;&#10;  &lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;&lt;p class=&quot;note&quot;&gt;*The long call has theoretically unlimited upside. †A long put's maximum profit is limited because BTC cannot fall below zero. Note that the illustrative bear spread is relatively expensive: its maximum profit is only $600 before fees.&lt;/p&gt;&#10;&#10;&lt;script&gt;&#10;const money = n =&gt; (n &lt; 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 });&#10;const configs = {&#10;  bull: { single: s =&gt; Math.max(s - 100000, 0) - 4000,&#10;          spread: s =&gt; Math.max(s - 100000, 0) - Math.max(s - 103000, 0) - 1700 },&#10;  bear: { single: s =&gt; Math.max(100000 - s, 0) - 4000,&#10;          spread: s =&gt; Math.max(100000 - s, 0) - Math.max(97000 - s, 0) - 2400 },&#10;};&#10;&#10;const NS = 'http://www.w3.org/2000/svg';&#10;const $ = id =&gt; document.getElementById(id);&#10;function el(tag, attrs, parent) {&#10;  const n = document.createElementNS(NS, tag);&#10;  for (const k in attrs) n.setAttribute(k, attrs[k]);&#10;  parent.appendChild(n);&#10;  return n;&#10;}&#10;&#10;// Fixed viewBox; the SVG scales to its column, so no resize handling is needed.&#10;const W = 520, H = 300, L = 44, R = 8, T = 10, B = 28;&#10;const minX = 80000, maxX = 120000, minY = -5000, maxY = 17000;&#10;const X = s =&gt; L + (s - minX) / (maxX - minX) * (W - L - R);&#10;const Y = v =&gt; T + (maxY - v) / (maxY - minY) * (H - T - B);&#10;&#10;function render(k) {&#10;  const svg = $(k), cfg = configs[k], price = +$(k + 'slider').value;&#10;  svg.replaceChildren();&#10;&#10;  for (let v = -5000; v &lt;= 15000; v += 5000) {&#10;    el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: v === 0 ? 'var(--gray-500)' : 'var(--rule)',&#10;                 'stroke-dasharray': v === 0 ? '5 4' : 'none' }, svg);&#10;    el('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }, svg).textContent = v / 1000 + 'k';&#10;  }&#10;  for (let s = minX; s &lt;= maxX; s += 10000)&#10;    el('text', { x: X(s), y: H - 8, 'text-anchor': 'middle' }, svg).textContent = s / 1000 + 'k';&#10;&#10;  const lines = [[cfg.single, 'var(--single)'], [cfg.spread, 'var(--spread)']];&#10;  for (const [fn, color] of lines) {&#10;    let d = '';&#10;    for (let s = minX; s &lt;= maxX; s += 100) d += (s === minX ? 'M' : 'L') + X(s).toFixed(1) + ',' + Y(fn(s)).toFixed(1);&#10;    el('path', { d, fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, svg);&#10;  }&#10;&#10;  el('line', { x1: X(price), x2: X(price), y1: T, y2: H - B, stroke: 'var(--gray-500)', 'stroke-dasharray': '4 4' }, svg);&#10;  for (const [fn, color] of lines) el('circle', { cx: X(price), cy: Y(fn(price)), r: 4, fill: color }, svg);&#10;&#10;  $(k + 'price').textContent = money(price);&#10;  for (const [id, v] of [['single', cfg.single(price)], ['spread', cfg.spread(price)]]) {&#10;    const out = $(k + id);&#10;    out.textContent = money(v);&#10;    out.className = v &gt;= 0 ? 'gain' : 'loss';&#10;  }&#10;}&#10;&#10;for (const k of ['bull', 'bear']) $(k + 'slider').addEventListener('input', () =&gt; render(k));&#10;render('bull');&#10;render('bear');&#10;&lt;/script&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;&#10;" width="720" height="480" style="border:0" title="Long put payoff chart"></iframe>

<h2 id="advantage-over-long-callput">Advantage over long call/put</h2>
<p>The Bull Call Debit Spread has three main advantages over a regular long call:</p>
<ol>
<li>Lower upfront premium — you spend less to enter the position.</li>
<li>Lower maximum loss — if BTC crashes or stays flat, you lose less money.</li>
<li>Lower breakeven price — BTC doesn't need to rise as much for you to make a profit.</li>
<li>Theta and Gamma shape changed</li>
</ol>

<div>
<iframe srcdoc="&lt;!doctype html&gt;&#10;&lt;html lang=&quot;en&quot;&gt;&#10;&lt;head&gt;&#10;&lt;meta charset=&quot;utf-8&quot;&gt;&#10;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&#10;&lt;title&gt;BTC Credit Spreads vs Short Options&lt;/title&gt;&#10;&lt;script&gt;document.write('&lt;style&gt;'+parent.document.getElementById('srcdoc-css-1').textContent+'&lt;\/style&gt;')&lt;/script&gt;&#10;&lt;style&gt;&#10;  :root { --single: var(--gray-700); --spread: var(--accent); --gain: var(--olive); --loss: #B5462F; }&#10;  body {&#10;    margin: 0; padding: 4px 8px; background: var(--bg); color: var(--fg);&#10;    font-family: var(--sans); font-size: 16px; line-height: 1.6;&#10;    -webkit-font-smoothing: antialiased;&#10;  }&#10;  h1 { margin: 0; font-size: 26px; }&#10;  h2 { margin: 0; font-size: 20px; }&#10;  p { margin: 6px 0 0; font-size: 14px; }&#10;  .lede { margin-top: 4px; }&#10;  /* Always two columns side by side; minmax(0, …) lets each column shrink instead of overflowing. */&#10;  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 12px; }&#10;  .panel { min-width: 0; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 10px; }&#10;  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font: 12px var(--mono); color: var(--muted); }&#10;  .legend i { display: inline-block; width: 16px; height: 2px; margin-right: 6px; vertical-align: middle; }&#10;  svg { display: block; width: 100%; height: auto; margin-top: 8px; overflow: visible; }&#10;  svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }&#10;  label { display: block; margin-top: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em;&#10;          text-transform: uppercase; color: var(--muted); }&#10;  label output { color: var(--fg); }&#10;  input[type=range] { display: block; width: 100%; height: 28px; margin: 2px 0 0; accent-color: var(-- t;td&gt;&lt;strong&gt;Net credit&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;+$1,300&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;&#10;    &lt;/table&gt;&lt;/div&gt;&#10;    &lt;div class=&quot;legend&quot;&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--spread)&quot;&gt;&lt;/i&gt;Bear call credit spread&lt;/span&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--single)&quot;&gt;&lt;/i&gt;Short call alone&lt;/span&gt;&#10;    &lt;/div&gt;&#10;    &lt;svg id=&quot;call&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Expiration P&amp;L of a bear call credit spread versus a short call&quot;&gt;&lt;/svg&gt;&#10;    &lt;label for=&quot;callSlider&quot;&gt;BTC at expiry &lt;output id=&quot;callPrice&quot;&gt;&lt;/output&gt;&lt;/label&gt;&#10;    &lt;input id=&quot;callSlider&quot; type=&quot;range&quot; min=&quot;80000&quot; max=&quot;120000&quot; step=&quot;250&quot; value=&quot;100000&quot;&gt;&#10;    &lt;div class=&quot;stats&quot;&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Credit spread P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;callSpread&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Short call P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;callShort&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;    &lt;/div&gt;&#10;    &lt;p class=&quot;summary&quot;&gt;&lt;strong&gt;Spread:&lt;/strong&gt; max profit +$1,300 · max loss −$1,700 · breakeven $101,300.&lt;br&gt;&lt;strong&gt;Short call:&lt;/strong&gt; max profit +$3,800 · unlimited theoretical loss · breakeven $103,800.&lt;/p&gt;&#10;  &lt;/div&gt;&#10;&#10;  &lt;div class=&quot;panel&quot;&gt;&#10;    &lt;h2&gt;2. Bull Put Credit Spread vs Short Put&lt;/h2&gt;&#10;    &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&#10;      &lt;tr&gt;&lt;th&gt;Leg&lt;/th&gt;&lt;th&gt;Premium&lt;/th&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Sell $100,000 put (bid)&lt;/td&gt;&lt;td class=&quot;gain&quot;&gt;+$3,800&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;Buy $97,000 put (ask)&lt;/td&gt;&lt;td class=&quot;loss&quot;&gt;−$1,800&lt;/td&gt;&lt;/tr&gt;&#10;      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Net credit&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;+$2,000&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;&#10;    &lt;/table&gt;&lt;/div&gt;&#10;    &lt;div class=&quot;legend&quot;&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--spread)&quot;&gt;&lt;/i&gt;Bull put credit spread&lt;/span&gt;&#10;      &lt;span&gt;&lt;i style=&quot;background:var(--single)&quot;&gt;&lt;/i&gt;Short put alone&lt;/span&gt;&#10;    &lt;/div&gt;&#10;    &lt;svg id=&quot;put&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Expiration P&amp;L of a bull put credit spread versus a short put&quot;&gt;&lt;/svg&gt;&#10;    &lt;label for=&quot;putSlider&quot;&gt;BTC at expiry &lt;output id=&quot;putPrice&quot;&gt;&lt;/output&gt;&lt;/label&gt;&#10;    &lt;input id=&quot;putSlider&quot; type=&quot;range&quot; min=&quot;80000&quot; max=&quot;120000&quot; step=&quot;250&quot; value=&quot;100000&quot;&gt;&#10;    &lt;div class=&quot;stats&quot;&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Credit spread P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;putSpread&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;      &lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Short put P&amp;amp;L&lt;/small&gt;&lt;strong id=&quot;putShort&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&#10;    &lt;/div&gt;&#10;    &lt;p class=&quot;summary&quot;&gt;&lt;strong&gt;Spread:&lt;/strong&gt; max profit +$2,000 · max loss −$1,000 · breakeven $98,000.&lt;br&gt;&lt;strong&gt;Short put:&lt;/strong&gt; max profit +$3,800 · worst-case loss −$96,200 if BTC reaches zero · breakeven $96,200.&lt;/p&gt;&#10;  &lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;&lt;p class=&quot;note&quot;&gt;At expiration, the short call's loss is theoretically unbounded as BTC rises. A short put's loss is large but bounded because BTC cannot fall below zero. Charts show only the $80,000–$120,000 range. A credit received upfront is not immediate realized profit: the position retains a liability until closed or expired. Real margin requirements and spread recognition depend on the exchange.&lt;/p&gt;&#10;&#10;&lt;script&gt;&#10;const money = n =&gt; (n &lt; 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US');&#10;const config = {&#10;  call: { short: s =&gt; 3800 - Math.max(s - 100000, 0),&#10;          spread: s =&gt; 1300 - Math.max(s - 100000, 0) + Math.max(s - 103000, 0) },&#10;  put:  { short: s =&gt; 3800 - Math.max(100000 - s, 0),&#10;          spread: s =&gt; 2000 - Math.max(100000 - s, 0) + Math.max(97000 - s, 0) },&#10;};&#10;&#10;const NS = 'http://www.w3.org/2000/svg';&#10;const $ = id =&gt; document.getElementById(id);&#10;function el(tag, attrs, parent) {&#10;  const n = document.createElementNS(NS, tag);&#10;  for (const k in attrs) n.setAttribute(k, attrs[k]);&#10;  parent.appendChild(n);&#10;  return n;&#10;}&#10;&#10;// Fixed viewBox; the SVG scales to its column, so no resize handling is needed.&#10;const W = 520, H = 300, L = 44, R = 8, T = 10, B = 28;&#10;const minX = 80000, maxX = 120000, minY = -18000, maxY = 6000;&#10;const X = s =&gt; L + (s - minX) / (maxX - minX) * (W - L - R);&#10;const Y = v =&gt; T + (maxY - v) / (maxY - minY) * (H - T - B);&#10;const cap = s =&gt; s[0].toUpperCase() + s.slice(1);&#10;&#10;function draw(kind) {&#10;  const svg = $(kind), cfg = config[kind], price = +$(kind + 'Slider').value;&#10;  svg.replaceChildren();&#10;&#10;  for (let v = -15000; v &lt;= 5000; v += 5000) {&#10;    el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: v === 0 ? 'var(--gray-500)' : 'var(--rule)',&#10;                 'stroke-dasharray': v === 0 ? '5 4' : 'none' }, svg);&#10;    el('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }, svg).textContent = v / 1000 + 'k';&#10;  }&#10;  for (let s = minX; s &lt;= maxX; s += 10000)&#10;    el('text', { x: X(s), y: H - 8, 'text-anchor': 'middle' }, svg).textContent = s / 1000 + 'k';&#10;&#10;  const lines = [['short', 'var(--single)'], ['spread', 'var(--spread)']];&#10;  for (const [name, color] of lines) {&#10;    let d = '';&#10;    for (let s = minX; s &lt;= maxX; s += 100) d += (s === minX ? 'M' : 'L') + X(s).toFixed(1) + ',' + Y(cfg[name](s)).toFixed(1);&#10;    el('path', { d, fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, svg);&#10;  }&#10;&#10;  el('line', { x1: X(price), x2: X(price), y1: T, y2: H - B, stroke: 'var(--gray-500)', 'stroke-dasharray': '4 4' }, svg);&#10;  for (const [name, color] of lines) el('circle', { cx: X(price), cy: Y(cfg[name](price)), r: 4, fill: color }, svg);&#10;&#10;  $(kind + 'Price').textContent = money(price);&#10;  for (const name of ['short', 'spread']) {&#10;    const out = $(kind + cap(name)), v = cfg[name](price);&#10;    out.textContent = (v &gt;= 0 ? '+' : '') + money(v);&#10;    out.className = v &gt;= 0 ? 'gain' : 'loss';&#10;  }&#10;}&#10;&#10;for (const kind of ['call', 'put']) {&#10;  $(kind + 'Slider').addEventListener('input', () =&gt; draw(kind));&#10;  draw(kind);&#10;}&#10;&lt;/script&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;&#10;" width="720" height="480" style="border:0" title="Long put payoff chart"></iframe>

<script>
  (function () {
    const slides = Array.from(document.querySelectorAll('div.marpit > svg[data-marpit-svg]'));
    let current = 0;

    // Letterbox each slide in its own background colour
    slides.forEach(function (s) {
      const sec = s.querySelector('section');
      if (sec) s.style.background = getComputedStyle(sec).backgroundColor;
    });

    function go(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides[current].scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')                    { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') { e.preventDefault(); go(0); }
      if (e.key === 'End')  { e.preventDefault(); go(slides.length - 1); }
    });

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) current = slides.indexOf(en.target);
      });
    }, { threshold: 0.6 });

    slides.forEach(function (s) { obs.observe(s); });
  })();
</script>
