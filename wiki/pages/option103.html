<script type="text/plain" id="srcdoc-css-2">
  :root { --grid: var(--rule); --band: var(--gray-500); --spot: var(--gray-700); }

  body {
    margin: 0; padding: 4px 8px; background: var(--bg); overflow: hidden; color: var(--fg);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px;
            color: var(--body); margin-bottom: 4px; }
  .legend .name { margin-left: auto; font-family: var(--mono); font-size: 12px;
                  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 22px; height: 0; border-top: 2px solid; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
  .chart .note { font-family: var(--sans); font-size: 13px; fill: var(--body); }
  .tip { position: absolute; pointer-events: none; background: var(--bg);
         border: 1px solid var(--gray-300); border-radius: 8px; padding: 10px 12px;
         font-size: 13px; line-height: 1.5; color: var(--body); white-space: nowrap;
         box-shadow: 0 4px 16px rgba(20,20,19,.08); }
  .tip b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip .t { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
            text-transform: uppercase; color: var(--muted); }
  .tip .m { color: var(--muted); }

</script>

<h2 id="what-happens-at-expiration">What happens at expiration?</h2>
<h3 id="traditional-stock-etf">Traditional Stock, ETF</h3>
<blockquote>
<p>Because the stock is above the strike, the call expires in the money (ITM) and is normally exercised automatically.</p>
</blockquote>
<ol>
<li>The call buyer purchases your stock for $100,000, the strike price.</li>
<li>You are obligated to deliver your share.</li>
<li>You receive $100,000 from the sale.</li>
<li>You keep the original $3,800 premium.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-theme="ivory" style="--theme:ivory;">
<h2 id="what-happens-at-expiration-1">What happens at expiration?</h2>
<h3 id="cash-settlement-on-crypto">Cash Settlement on Crypto</h3>
<blockquote>
<p>Collateral requirement: You still need sufficient assets to support your potential payment obligation</p>
</blockquote>
<ol>
<li>Premium received when selling	+$3,800</li>
<li>Cash settlement at expiry	−$10,000</li>
<li>Net option P&amp;L	−$6,200</li>
</ol>
</section>

<h2 id="what-happens-at-expiration-2">What happens at expiration?</h2>
<h3 id="traditional-stock-etf-1">Traditional Stock, ETF</h3>
<blockquote>
<p>At expiration, if the asset falls to $90,000 The put buyer has the right to sell the stock to you for $100,000, even though it's now worth only $90,000.</p>
</blockquote>
<ol>
<li>The put buyer sell the stock for $100,000, the strike price.</li>
<li>You are obligated to pay $100,000.</li>
<li>You receive the stock.</li>
<li>Net PnL is $9,000+$3,800-$100,000 = -$6,200</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-theme="ivory" style="--theme:ivory;">
<h2 id="both-payout-chart-is-similar-to-each-other">Both Payout chart is similar to each other</h2>
<ul>
<li><strong>+ Delta</strong> : they generally benefit from rising underlying prices</li>
<li><strong>+ Theta</strong>: Benefit from time decay, all else equal.</li>
<li><strong>- Gamma</strong>: Large directional moves can hurt, particularly sharp declines.</li>
<li><strong>- Vega</strong>: Rising implied volatility generally hurts before expiration.</li>
</ul>

<script>
  (function () {
    const slides = Array.from(document.querySelectorAll('div.marpit > svg[data-marpit-svg]'));
    let current = 0;

    // Letterbox each slide in its own background colour
    slides.forEach(function (s) {
      const sec = s.querySelector('section');
      if (sec) s.style.background = getComputedStyle(sec).backgroundColor;
    });

    function go(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides[current].scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')                    { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') { e.preventDefault(); go(0); }
      if (e.key === 'End')  { e.preventDefault(); go(slides.length - 1); }
    });

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) current = slides.indexOf(en.target);
      });
    }, { threshold: 0.6 });

    slides.forEach(function (s) { obs.observe(s); });
  })();
</script>
