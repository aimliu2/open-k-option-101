<script type="text/plain" id="srcdoc-css-2">
  :root { --grid: var(--rule); --profit: var(--olive); --loss: var(--clay); }

  body {
    margin: 0; padding: 4px 8px; background: var(--bg); overflow: hidden; color: var(--fg);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px;
            color: var(--body); margin-bottom: 4px; }
  .legend .name { margin-left: auto; font-family: var(--mono); font-size: 12px;
                  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
  .chart .note { font-family: var(--sans); font-size: 13px; fill: var(--body); }
  .tip { position: absolute; pointer-events: none; background: var(--bg);
         border: 1px solid var(--gray-300); border-radius: 8px; padding: 10px 12px;

         box-shadow: 0 4px 16px rgba(20,20,19,.08); }

  .tip .t { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
            text-transform: uppercase; color: var(--muted); }

<h2 id="otm-and-atm">OTM and ATM</h2>
<h6 id="moneyness-itm--atm--otm-is-defined-from-the-perspective-of-the-option-buyer--the-one-who-pays-the-premium-to-acquire-the-right-to-exercise">Moneyness (ITM / ATM / OTM) is defined from the perspective of the option buyer — the one who pays the premium to acquire the right to exercise.</h6>
<div>
<iframe srcdoc="&lt;!doctype html&gt;&#10;&lt;html lang=&quot;en&quot;&gt;&#10;&lt;head&gt;&#10;&lt;meta charset=&quot;utf-8&quot;&gt;&#10;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&#10;&lt;title&gt;BTC Options Moneyness&lt;/title&gt;&#10;&lt;script&gt;document.write('&lt;style&gt;'+parent.document.getElementById('srcdoc-css-1').textContent+'&lt;\/style&gt;')&lt;/script&gt;&#10;&lt;style&gt;&#10;  :root { --grid: var(--rule); --itm: var(--accent); }&#10;&#10;  body {&#10;    margin: 0; padding: 4px 8px; background: var(--bg); overflow: hidden; color: var(--fg);&#10;    font-family: var(--sans); font-size: 16px; line-height: 1.6;&#10;    -webkit-font-smoothing: antialiased;&#10;  }&#10;  .legend { display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px;&#10;            color: var(--body); margin-bottom: 4px; }&#10;  .legend .name { margin-left: auto; font-family: var(--mono); font-size: 12px;&#10;                  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }&#10;  .legend span { display: inline-flex; align-items: center; gap: 8px; }&#10;  .swatch { width: 22px; height: 0; border-top: 2px solid; }&#10;  .block { width: 22px; height: 12px; border-radius: 3px; }&#10;  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }&#10;  .chart { position: relative; }&#10;  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }&#10;  .chart text { font-family: var(--mono); font-size: 12px; fill: var(--muted); }&#10;  .chart .note { font-family: var(--sans); font-size: 13px; fill: var(--body); }&#10;  .chart .lane { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; fill: var(--fg); }&#10;  .tip { position: absolute; pointer-events: none; background: var(--bg);&#10;         border: 1px solid var(--gray-300); border-radius: 8px; padding: 10px 12px;&#10;         font-size: 13px; line-height: 1.5; color: var(--body); white-space: nowrap;&#10;         box-shadow: 0 4px 16px rgba(20,20,19,.08); }&#10;  .tip b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }&#10;  .tip .t { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;&#10;            text-transform: uppercase; color: var(--muted); }&#10;&#10;&lt;/style&gt;&#10;&lt;/head&gt;&#10;&lt;body&gt;&#10;&lt;div class=&quot;legend&quot;&gt;&#10;  &lt;span&gt;&lt;i class=&quot;block&quot; style=&quot;background:var(--itm);opacity:.22&quot;&gt;&lt;/i&gt;ITM&lt;/span&gt;&#10;  &lt;span&gt;&lt;i class=&quot;block&quot; style=&quot;background:var(--rule)&quot;&gt;&lt;/i&gt;OTM&lt;/span&gt;&#10;  &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;border-color:var(--gray-500)&quot;&gt;&lt;/i&gt;Spot = ATM&lt;/span&gt;&#10;  &lt;span&gt;&lt;i class=&quot;dot&quot;&gt;&lt;/i&gt;Example strike&lt;/span&gt;&#10;  &lt;span class=&quot;name&quot; id=&quot;name&quot;&gt;&lt;/span&gt;&#10;&lt;/div&gt;&#10;&lt;div class=&quot;chart&quot; id=&quot;chart&quot;&gt;&lt;div class=&quot;tip&quot; id=&quot;tip&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;&#10;&#10;&lt;script&gt;&#10;/* ---- CONFIG ---- */&#10;const SPOT = 100000;&#10;const LANES = [ // ITM side relative to spot; example strike&#10;  { key: &quot;call&quot;, label: &quot;CALL&quot;, itmBelow: true,  strike: 103000 },&#10;  { key: &quot;put&quot;,  label: &quot;PUT&quot;,  itmBelow: false, strike: 97000 }&#10;];&#10;const x0 = 90000, x1 = 110000, SNAP = 1000;&#10;/* ---------------- */&#10;&#10;const usd = v =&gt; &quot;$&quot; + v.toLocaleString(&quot;en-US&quot;);&#10;const k = v =&gt; (v / 1000) + &quot;k&quot;;&#10;const status = (lane, K) =&gt; K === SPOT ? &quot;ATM&quot; : (K &lt; SPOT) === lane.itmBelow ? &quot;ITM&quot; : &quot;OTM&quot;;&#10;const intrinsic = (lane, K) =&gt; Math.max(lane.key === &quot;call&quot; ? SPOT - K : K - SPOT, 0);&#10;&#10;document.getElementById(&quot;name&quot;).textContent = `Moneyness · BTC spot ${usd(SPOT)}`;&#10;&#10;const NS = &quot;http://www.w3.org/2000/svg&quot;;&#10;const el = (tag, attrs, parent) =&gt; {&#10;  const n = document.createElementNS(NS, tag);&#10;  for (const a in attrs) n.setAttribute(a, attrs[a]);&#10;  if (parent) parent.appendChild(n);&#10;  return n;&#10;};&#10;&#10;const box = document.getElementById(&quot;chart&quot;), tip = document.getElementById(&quot;tip&quot;);&#10;let svg;&#10;&#10;function draw() {&#10;  const W = Math.max(320, box.clientWidth), H = Math.max(240, innerHeight - box.offsetTop - 8);&#10;  const m = { l: 56, r: 16, t: 28, b: 44 };&#10;  const X = v =&gt; m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);&#10;  const plotH = H - m.t - m.b, laneH = Math.min(56, plotH / 4);&#10;  const laneY = i =&gt; m.t + plotH * (i === 0 ? 0.3 : 0.75) - laneH / 2;&#10;&#10;  if (svg) svg.remove();&#10;  svg = el(&quot;svg&quot;, { viewBox: `0 0 ${W} ${H}`, role: &quot;img&quot;,&#10;    &quot;aria-label&quot;: `Call and put moneyness versus strike price, BTC spot ${usd(SPOT)}` });&#10;  box.insertBefore(svg, tip);&#10;&#10;  // x axis: strike price&#10;  for (let v = x0; v &lt;= x1; v += 5000) {&#10;    el(&quot;line&quot;, { x1: X(v), x2: X(v), y1: m.t, y2: H - m.b, stroke: &quot;var(--grid)&quot; }, svg);&#10;    el(&quot;text&quot;, { x: X(v), y: H - m.b + 22, &quot;text-anchor&quot;: &quot;middle&quot; }, svg).textContent = &quot;$&quot; + k(v);&#10;  }&#10;  el(&quot;text&quot;, { x: W - m.r, y: H - 4, &quot;text-anchor&quot;: &quot;end&quot; }, svg).textContent = &quot;Strike price →&quot;;&#10;&#10;  // lanes: ITM half tinted, OTM half neutral; zone names inside&#10;  LANES.forEach((lane, i) =&gt; {&#10;    const y = laneY(i), cy = y + laneH / 2;&#10;    el(&quot;rect&quot;, { x: X(x0), y, width: X(x1) - X(x0), height: laneH, rx: 6, fill: &quot;var(--rule)&quot; }, svg);&#10;    const [a, b] = lane.itmBelow ? [x0, SPOT] : [SPOT, x1];&#10;    el(&quot;rect&quot;, { x: X(a), y, width: X(b) - X(a), height: laneH, rx: 6,&#10;      fill: &quot;var(--itm)&quot;, &quot;fill-opacity&quot;: .22 }, svg);&#10;    el(&quot;text&quot;, { class: &quot;lane&quot;, x: m.l - 12, y: cy + 4, &quot;text-anchor&quot;: &quot;end&quot; }, svg).textContent = lane.label;&#10;    // zone names sit at the outer ends, away from strikes near spot&#10;    el(&quot;text&quot;, { class: &quot;note&quot;, x: X(x0) + 12, y: cy + 4, &quot;text-anchor&quot;: &quot;start&quot; }, svg)&#10;      .textContent = lane.itmBelow ? &quot;ITM · K &lt; spot&quot; : &quot;OTM · K &lt; spot&quot;;&#10;    el(&quot;text&quot;, { class: &quot;note&quot;, x: X(x1) - 12, y: cy + 4, &quot;text-anchor&quot;: &quot;end&quot; }, svg)&#10;      .textContent = lane.itmBelow ? &quot;OTM · K &gt; spot&quot; : &quot;ITM · K &gt; spot&quot;;&#10;  });&#10;&#10;  // spot line = ATM&#10;  el(&quot;line&quot;, { x1: X(SPOT), x2: X(SPOT), y1: m.t, y2: H - m.b, stroke: &quot;var(--gray-500)&quot;, &quot;stroke-width&quot;: 2 }, svg);&#10;  el(&quot;text&quot;, { x: X(SPOT), y: m.t - 10, &quot;text-anchor&quot;: &quot;middle&quot; }, svg).textContent = `SPOT ${usd(SPOT)} = ATM`;&#10;&#10;  // example strikes (drawn after the spot line so they sit on top)&#10;  LANES.forEach((lane, i) =&gt; {&#10;    const y = laneY(i), K = lane.strike;&#10;    el(&quot;circle&quot;, { cx: X(K), cy: y + laneH / 2, r: 6, fill: &quot;var(--accent)&quot;, stroke: &quot;var(--bg)&quot;, &quot;stroke-width&quot;: 2 }, svg);&#10;    el(&quot;text&quot;, { class: &quot;note&quot;, x: X(K), y: y + laneH + 18, &quot;text-anchor&quot;: &quot;middle&quot; }, svg)&#10;      .textContent = `K ${usd(K)} · ${status(lane, K)}`;&#10;  });&#10;&#10;  // hover layer: treat the cursor as a hypothetical strike&#10;  const cross = el(&quot;line&quot;, { y1: m.t, y2: H - m.b, stroke: &quot;var(--gray-500)&quot;, &quot;stroke-width&quot;: 1,&#10;    &quot;stroke-dasharray&quot;: &quot;3 3&quot;, visibility: &quot;hidden&quot; }, svg);&#10;  const hit = el(&quot;rect&quot;, { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: &quot;transparent&quot; }, svg);&#10;&#10;  const show = e =&gt; {&#10;    const r = svg.getBoundingClientRect(), sx = W / r.width;&#10;    const px = (e.clientX - r.left) * sx;&#10;    const raw = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);&#10;    const K = Math.min(x1, Math.max(x0, Math.round(raw / SNAP) * SNAP));&#10;    const cx = X(K);&#10;    cross.setAttribute(&quot;x1&quot;, cx); cross.setAttribute(&quot;x2&quot;, cx); cross.setAttribute(&quot;visibility&quot;, &quot;visible&quot;);&#10;    tip.innerHTML = `&lt;div class=&quot;t&quot;&gt;Strike ${usd(K)}&lt;/div&gt;` + LANES.map(l =&gt;&#10;      `${l.label[0] + l.label.slice(1).toLowerCase()} &lt;b&gt;${status(l, K)}&lt;/b&gt; · intrinsic &lt;b&gt;${usd(intrinsic(l, K))}&lt;/b&gt;`&#10;    ).join(&quot;&lt;br&gt;&quot;);&#10;    tip.hidden = false;&#10;    const left = cx / sx, flip = left &gt; r.width - 230;&#10;    tip.style.left = (flip ? left - tip.offsetWidth - 14 : left + 14) + &quot;px&quot;;&#10;    tip.style.top = (m.t / sx) + &quot;px&quot;;&#10;  };&#10;  const hide = () =&gt; { tip.hidden = true; cross.setAttribute(&quot;visibility&quot;, &quot;hidden&quot;); };&#10;  hit.addEventListener(&quot;pointermove&quot;, show);&#10;  hit.addEventListener(&quot;pointerdown&quot;, show);&#10;  hit.addEventListener(&quot;pointerleave&quot;, hide);&#10;}&#10;&#10;let lastW = 0;&#10;new ResizeObserver(() =&gt; { if (box.clientWidth + innerHeight !== lastW) { lastW = box.clientWidth + innerHeight; draw(); } }).observe(document.body);&#10;&lt;/script&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;&#10;" width="720" height="480" style="border:0" title="Long put payoff chart"></iframe>

et v = x0; v &lt;= x1; v += step)&#10;    el(&quot;text&quot;, { x: X(v), y: H - m.b + 22, &quot;text-anchor&quot;: &quot;middle&quot; }, svg).textContent = &quot;$&quot; + k(v);&#10;  el(&quot;text&quot;, { x: W - m.r, y: H - 4, &quot;text-anchor&quot;: &quot;end&quot; }, svg).textContent = &quot;BTC price at expiry →&quot;;&#10;&#10;  // profit / loss zones (position + label carry meaning; tint is secondary)&#10;  const pts = CFG.rows.map(r =&gt; [X(r[0]), Y(r[2])]);&#10;  const area = `M${X(x0)},${Y(0)} L` + pts.map(p =&gt; p.join(&quot;,&quot;)).join(&quot; L&quot;) + ` L${X(x1)},${Y(0)} Z`;&#10;  const defs = el(&quot;defs&quot;, {}, svg);&#10;  const cpU = el(&quot;clipPath&quot;, { id: &quot;up&quot; }, defs);&#10;  el(&quot;rect&quot;, { x: 0, y: 0, width: W, height: Y(0) }, cpU);&#10;  const cpD = el(&quot;clipPath&quot;, { id: &quot;dn&quot; }, defs);&#10;  el(&quot;rect&quot;, { x: 0, y: Y(0), width: W, height: H }, cpD);&#10;  el(&quot;path&quot;, { d: area, fill: &quot;var(--profit)&quot;, &quot;fill-opacity&quot;: .16, &quot;clip-path&quot;: &quot;url(#up)&quot; }, svg);&#10;  el(&quot;path&quot;, { d: area, fill: &quot;var(--loss)&quot;, &quot;fill-opacity&quot;: .14, &quot;clip-path&quot;: &quot;url(#dn)&quot; }, svg);&#10;&#10;  // strike marker&#10;  el(&quot;line&quot;, { x1: X(STRIKE), x2: X(STRIKE), y1: m.t, y2: H - m.b,&#10;    stroke: &quot;var(--gray-300)&quot;, &quot;stroke-dasharray&quot;: &quot;2 4&quot; }, svg);&#10;  el(&quot;text&quot;, { x: X(STRIKE), y: m.t - 10, &quot;text-anchor&quot;: &quot;middle&quot; }, svg).textContent = `STRIKE $${k(STRIKE)}`;&#10;&#10;  // payoff (dashed, recessive) then net P&amp;L (accent)&#10;  const line = i =&gt; &quot;M&quot; + CFG.rows.map(r =&gt; `${X(r[0])},${Y(r[i])}`).join(&quot; L&quot;);&#10;  el(&quot;path&quot;, { d: line(1), fill: &quot;none&quot;, stroke: &quot;var(--muted)&quot;, &quot;stroke-width&quot;: 2,&#10;    &quot;stroke-dasharray&quot;: &quot;5 5&quot;, &quot;stroke-linejoin&quot;: <script>
  (function () {
    const slides = Array.from(document.querySelectorAll('div.marpit > svg[data-marpit-svg]'));
    let current = 0;

    // Letterbox each slide in its own background colour
    slides.forEach(function (s) {
      const sec = s.querySelector('section');
      if (sec) s.style.background = getComputedStyle(sec).backgroundColor;
    });

    function go(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides[current].scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')                    { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') { e.preventDefault(); go(0); }
      if (e.key === 'End')  { e.preventDefault(); go(slides.length - 1); }
    });

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) current = slides.indexOf(en.target);
      });
    }, { threshold: 0.6 });

    slides.forEach(function (s) { obs.observe(s); });
  })();
</script>
